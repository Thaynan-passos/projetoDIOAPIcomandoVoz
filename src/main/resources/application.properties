spring.application.name=budgeting-ai

# Chave lida da variável de ambiente OPENAI_API_KEY (nunca coloque a chave no código)
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.speech.options.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.options.voice=alloy

# Banco em memória (H2): não precisa de Docker nem de instalação
spring.datasource.url=jdbc:h2:mem:budgeting
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

spring.servlet.multipart.max-file-size=10MB
